<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milano Quartieri – Game Master</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css?v=1.1"></head><body>
<header class="topbar"><div class="brand">Milano Quartieri Challengi</div><div class="team-badge" style="background:#7c3aed">Game Master</div></header><main class="container"><div id="configWarning" class="warning-box hidden"></div><div class="statusbar"><span id="conn" class="pill">Connecting…</span><span id="phase" class="pill"></span><span id="serverTime" class="pill"></span><span id="revision" class="pill"></span><span id="version" class="pill"></span></div>
<div class="panel"><h2>Live score</h2><div id="scores" class="score-grid"></div></div><div class="gm-grid"><section><div class="panel"><h2>Active board</h2><div id="gmBoard" class="board"></div></div><div class="panel"><h2>Map</h2><div id="map" class="map"></div></div></section><aside><div class="panel"><h2>Game Master actions</h2><div id="gmActions"></div></div><div class="panel"><h2>Bonus tracker</h2><div id="bonus"></div></div><div class="panel"><h2>Recent log</h2><div id="log" class="log"></div></div></aside></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="backend-config.js"></script><script src="common.js?v=1.1"></script><script src="gm.js?v=1.1"></script></body></html>
